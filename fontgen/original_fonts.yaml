# ============================================================================
# 追加模式配置 —— 在游戏【原始贴图后面追加汉字】
# 源贴图目录：本配置同目录下的 original_dds/（游戏原始 224 字符贴图，未压缩 BGRA）
# 用法： python build_font_atlas.py original_fonts.yaml
# 每个原始 DDS 一条记录，保留基础 224 字符，末尾追加汉字。
# 输出（默认 ./out_append/）：<同原始名>.dds（32 位 BGRA，与原始一致）
# 以及 <同原始名>.tuv（TUVCOUNT = 224 + 汉字数，前 224 行坐标原样保留）。
# source_dds / source_tuv 相对本配置文件所在目录解析。
# ============================================================================

SRC: "original_dds"

charlist: "charlist.txt"
dict_file: "DictRead.txt"     # ★ 执行时自动用本文件生成 charlist（提取全部非 ASCII 字符）
                              #   若不存在则沿用现有 charlist.txt
auto_charlist: true           # false 则关闭自动生成
output_dir: "out_append"
atlas_width: 2048          # 画布宽（2 的幂，与正确字库一致；汉字从原图下方逐行追加）
output_format: "dxt"       # dxt=DXT3 输出（推荐，正确字库同款） / bgra=未压缩 BGRA
padding: 1

# ---- 字体通用默认值（每个字体可覆盖） ----
defaults:
  font_path: "SourceHanSansHWSC-VF.ttf"   # 字体文件（本目录），可换成 思源宋体/临海隶书 等
  render_mode: "smooth"
  sharpness: 1.5
  supersample: 2
  outline: false        # 黑线描边（_c 变体）
  bold: false           # 加粗（_b 变体）
  zero_space_width: false
  padding_top: 0
  padding_bottom: 0
  padding_left: 0
  padding_right: 0

# ============================================================================
# 仅含 I:\...\字体生成\Original_Fonts 目录里实际存在的字体（不含 console）
# 字号按 字体说明.md：small/paragraph=14，big_caption/med_caption/font18=18，font12=12
# ============================================================================
fonts:
  # ---- 14 号：small 家族 ----
  - { source_dds: "!!SRC/small.dds",    source_tuv: "!!SRC/small.tuv",    size: 14 }
  - { source_dds: "!!SRC/small_c.dds",  source_tuv: "!!SRC/small_c.tuv",  size: 14, outline: true }

  # ---- 18 号：big_caption 家族 ----
  - { source_dds: "!!SRC/big_caption.dds",   source_tuv: "!!SRC/big_caption.tuv",   size: 18 }
  - { source_dds: "!!SRC/big_caption_c.dds", source_tuv: "!!SRC/big_caption_c.tuv", size: 18, outline: true }

  # ---- 14 号：paragraph 家族 ----
  - { source_dds: "!!SRC/paragraph.dds",   source_tuv: "!!SRC/paragraph.tuv",   size: 14 }
  - { source_dds: "!!SRC/paragraph_c.dds", source_tuv: "!!SRC/paragraph_c.tuv", size: 14, outline: true }

  # ---- 12 号：font12 家族（a/b 共享 font12.tuv） ----
  - { source_dds: "!!SRC/font12a.dds", source_tuv: "!!SRC/font12.tuv", size: 12, tuv_out: "font12" }
  - { source_dds: "!!SRC/font12b.dds", source_tuv: "!!SRC/font12.tuv", size: 12, outline: true, tuv_out: "font12" }

  # ---- 14 号：font14 家族（a/b 共享 font14.tuv） ----
  - { source_dds: "!!SRC/font14a.dds", source_tuv: "!!SRC/font14.tuv", size: 14, tuv_out: "font14" }
  - { source_dds: "!!SRC/font14b.dds", source_tuv: "!!SRC/font14.tuv", size: 14, outline: true, tuv_out: "font14" }

  # ---- 18 号：font18 家族（a/b 共享 font18.tuv） ----
  - { source_dds: "!!SRC/font18a.dds", source_tuv: "!!SRC/font18.tuv", size: 18, tuv_out: "font18" }
  - { source_dds: "!!SRC/font18b.dds", source_tuv: "!!SRC/font18.tuv", size: 18, outline: true, tuv_out: "font18" }

  # ---- 18 号：med_caption 家族 ----
  - { source_dds: "!!SRC/med_caption.dds",   source_tuv: "!!SRC/med_caption.tuv",   size: 18 }
  - { source_dds: "!!SRC/med_caption_c.dds", source_tuv: "!!SRC/med_caption_c.tuv", size: 18, outline: true }
  
    # ---- 18 号：console ----
  - { source_dds: "!!SRC/console.dds",   source_tuv: "!!SRC/console.tuv",   size: 18 }