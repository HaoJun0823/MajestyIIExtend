; ============================================================================
; 字体图集生成器 INI 示例
; 用法： python build_font_atlas.py font_config.ini
; 约定：
;   [GLOBAL] 段只放全局设置；[font:<prefix>] 段名=字体配置（prefix 用冒号后内容）
;   段名中的冒号后可带点：如 [font:ui]
; ============================================================================

[GLOBAL]
charlist = charlist.txt
output_dir = out
atlas_width = 2048
padding = 1
; texconv 绝对路径代理（留空自动搜索）
texconv =

; 通用默认值
render_mode = smooth
sharpness = 1.5
bold = false
supersample = 2
threshold = 128
zero_space_width = true
padding_top = 0
padding_bottom = 0
padding_left = 0
padding_right = 0
auto_dds = true
patch_png =

[font:font_ui]
font_path = C:/Windows/Fonts/simsun.ttc
size = 32

[font:font_title]
font_path = C:/Windows/Fonts/simhei.ttf
size = 36
sharpness = 2.0
supersample = 3