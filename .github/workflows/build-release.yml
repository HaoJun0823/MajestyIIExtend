name: build-release

# ============================================================================
# MajestyIIExtend 汉化补丁构建 + 自动发 Release
# ----------------------------------------------------------------------------
# 产物（CHS / CHT 两个独立 zip，均可直接解压到游戏根目录）：
#   MajestyII-CHS-{date}-{time}.zip
#   MajestyII-CHT-{date}-{time}.zip
#
# 触发：
#   push(master/main/rebuild) —— 构建 + 校验 + 上传两个 zip 到 Artifacts；
#                            随后 publish job 在**同一 run** 内按日期-时间打 tag
#                            并发 Release（两个 ASCII 名 zip 附件），无需手动打 tag。
#   pull_request          —— 构建 + 校验（门禁，不发布）
#   workflow_dispatch     —— 手动；可勾选跳过烘焙 / 跳过 DLL 编译
#
# ★ 编译路线 = cl.exe 直调（v141_xp，32 位 DLL），不是 MSBuild：
#   - 完全复刻 build_deploy.sh / build.bat 的 flags，产出无 CRTer
#   - 不依赖 NuGet restore（dllmain.cpp 不用 MinHook），也不需要 Windows SDK
#     7.1A（那是 v141_xp 在 MSBuild 里才强制的坑）
#   - windows-2022（= windows-latest，VS2022）镜像已自带 v141(MSVC 14.16) 工具集，
#     直接 vswhere 动态发现 cl.exe 即可，无需现场安装（参考 cnc-ddraw 在 windows-latest
#     直编 v141_xp，其 WinXP 组件安装步骤已注释掉 = 镜像自带）。windows-2019 已于
#     2025 年前后下架，故不能用。
#
# ★ 字体烘焙（from_scratch）需要把以下文件提交进 git（.gitignore 已放行）：
#   fontgen/*.ttf、fontgen/original_dds/、fontgen/texconv.exe、
#   fontgen/DictRead_V14_GB18030.txt
#   这些不在就无法烘焙字库，release 会缺字库。
# ============================================================================

on:
  push:
    branches: [main, master, rebuild]
    paths-ignore:
      - '**.md'
      - 'archives/**'
      - 'docs/**'
      - '.workbuddy/**'
  pull_request:
    branches: [main, master, rebuild]
    paths-ignore:
      - '**.md'
      - 'archives/**'
      - 'docs/**'
      - '.workbuddy/**'
  workflow_dispatch:
    inputs:
      skip_bake:
        description: '跳过字体烘焙（默认 false：正常 CI 不烘焙，直接复用已提交的 fontgen/font_auto_build 成品字库 —— 该字库已与 V15 逐字节一致）'
        type: boolean
        default: false
      skip_dll:
        description: '跳过 DLL 编译（仅重建资源包，需已有 dll 产物 —— CI 上不要勾）'
        type: boolean
        default: false

permissions:
  contents: read

# 同一分支/PR 的新推送取消旧的进行中构建，省 runner
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建发布包
    # v141_xp：windows-2022（VS2022 镜像）已自带 v141(MSVC 14.16) 工具集，
    # 经 vswhere 发现 14.16 cl.exe 直编即可（参考 cnc-ddraw 在 windows-latest 编
    # v141_xp，WinXP 组件安装步骤已注释掉 = 镜像自带）。windows-2019 已下架，不能用。
    # 下方「检查 v141 工具集」步骤在找不到 14.16 时立即失败，杜绝静默回退到 v142
    # （那会产出错误的 143872B DLL；正确的 v141_xp 产物是 144384B）。
    runs-on: windows-2022
    timeout-minutes: 60

    env:
      # 本仓库所有 .py 都与中文交互；CI 上强制 UTF-8，避免 UnicodeEncodeError
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'

    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      # ── 环境准备 ─────────────────────────────────────────────────────
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Python 依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install opencc Pillow freetype-py pyyaml fonttools numpy

      # ── 探查镜像上可用的 MSVC 工具集（诊断用，不再因缺失 v141 硬失败）────
      # windows-2022 镜像默认不带 v141(MSVC 14.16)；最终是否产出正确 v141_xp DLL
      # 由下方「校验 asi 体积」闸门兜底（非 144384B 直接失败，绝不发错包）。
      # 这里只打印所有 cl.exe 供排查，并把发现的 v141 cl.exe 写入 $env，供 build 步优先使用。
      - name: 探查 MSVC 工具集
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $vsw = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          Write-Host "=== 镜像上所有 cl.exe (Hostx86\x86) ==="
          if (Test-Path $vsw) {
            & $vsw -all -products * -find 'VC\Tools\MSVC\*\bin\Hostx86\x86\cl.exe' 2>$null | ForEach-Object { Write-Host "  $_" }
          }
          # 也直接扫盘兜底
          Get-ChildItem "C:\Program Files*\Microsoft Visual Studio\*\VC\Tools\MSVC\*\bin\Hostx86\x86\cl.exe" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "  $($_.FullName)" }
          # 记录是否找到 14.16（v141）
          $v141 = if (Test-Path $vsw) {
            & $vsw -all -products * -find 'VC\Tools\MSVC\14.16*\bin\Hostx86\x86\cl.exe' 2>$null | Select-Object -First 1
          } else { $null }
          if (-not $v141) {
            $v141 = Get-ChildItem "C:\Program Files*\Microsoft Visual Studio\*\VC\Tools\MSVC\14.16*\bin\Hostx86\x86\cl.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($v141) { Write-Host "✓ 发现 v141 cl.exe: $v141" } else { Write-Host "⚠ 镜像未预装 v141(14.16)，将依赖 build_release.ps1 的 fallback 或后续安装" }
          # 暴露给后续步骤（build_release.ps1 内部也用 vswhere 再发现一次）
          Add-Content -Path $env:GITHUB_ENV -Value "MJ2_V141_CL=$v141"

      # ── 核心：装配脚本 ─────────────────────────────────────────────
      # CI 恒用已提交的 fontgen/font_auto_build 成品字库（与 V15 逐字节一致），
      # 不现场重烘焙 —— 从零烘焙在 CI 上会产出 4096 尺寸的错误字库（已被 V15 判定为错）。
      - name: 运行 build_release.ps1
        shell: pwsh
        run: |
          # 用 hashtable splatting 而非字符串数组：@('-SkipBake') 展开时
          # '-SkipBake' 会被当作位置参数（switch 不生效，PS5.1 静默绑到 OutDir、
          # PS7 直接报 "positional parameter cannot be found"）。@{SkipBake=$true}
          # 才能让 [switch] 参数正确生效。
          $skipArgs = @{}
          if ("${{ github.event.inputs.skip_bake }}" -eq 'true' -or "${{ github.event_name }}" -eq 'push') { $skipArgs.SkipBake = $true }
          if ("${{ github.event.inputs.skip_dll }}" -eq 'true') { $skipArgs.SkipDll = $true }
          Write-Host ">>> 参数: $($skipArgs.Keys -join ',')"
          & "$PWD\tools\build_release.ps1" @skipArgs -OutDir "build_out"
          if ($LASTEXITCODE -ne 0) { throw "build_release.ps1 失败 rc=$LASTEXITCODE" }

      # ── 产物体积闸门：杜绝错 DLL 流入发布 ────────────────────────────
      # 正确 v141_xp asi = 144384B；若 CI 静默回退到 v142 会产出 143872B（错误），
      # 这里在上传前断言两个 asi 体积都正确，异常则直接失败、绝不发错包。
      - name: 校验 asi 体积（必须为 144384B v141_xp）
        shell: pwsh
        run: |
          $want = 144384
          foreach ($z in @('build_out/MajestyII-CHS-*.zip','build_out/MajestyII-CHT-*.zip')) {
            $zip = Get-Item $z -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $zip) { throw "找不到构建产物: $z" }
            # 在 zip 内定位 asi（update/MajestyII_GB18030_2000.asi）
            $shell = New-Object -ComObject Shell.Application
            $zp = $shell.NameSpace($zip.FullName)
            $entry = $zp.Items() | ForEach-Object { $zp.GetDetailsOf($_, 0) } | Where-Object { $_ -match 'MajestyII_GB18030_2000\.asi$' } | Select-Object -First 1
            if (-not $entry) { throw "未在 $($zip.Name) 内找到 MajestyII_GB18030_2000.asi" }
            # 通过临时解压读取精确字节大小
            $tmp = Join-Path $env:TEMP ("asi_$(Get-Random)")
            New-Item -ItemType Directory -Force -Path $tmp | Out-Null
            try {
              Expand-Archive -Path $zip.FullName -DestinationPath $tmp -Force
              $asi = Get-ChildItem $tmp -Recurse -Filter 'MajestyII_GB18030_2000.asi' | Select-Object -First 1
              if (-not $asi) { throw "解压后未找到 asi: $($zip.Name)" }
              $sz = $asi.Length
              if ($sz -ne $want) { throw "asi 体积错误: $($asi.Name) = $sz B（应为 $want B，疑似 v142 回退）" }
              Write-Host "✓ $($zip.Name) -> asi $sz B"
            } finally { Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue }
          }

      # ── 上传 Artifact ─────────────────────────────────────────────
      - name: 上传 CHS 发布包
        uses: actions/upload-artifact@v4
        with:
          name: mj2-chs
          path: build_out/MajestyII-CHS-*.zip
          if-no-files-found: error
      - name: 上传 CHT 发布包
        uses: actions/upload-artifact@v4
        with:
          name: mj2-cht
          path: build_out/MajestyII-CHT-*.zip
          if-no-files-found: error

  # ── 发布：push master/main/rebuild 时自动打日期 tag + 发 Release ─────────────────
  # 复刻 SR_GAME_CHINESE：不再依赖「tag push 重触发 workflow」（GITHUB_TOKEN
  # 推的 tag 不触发 on:push，会静默失败），改为在同一 run 内由 gh CLI 直接发版。
  publish:
    name: 发布 Release
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rebuild') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 检出仓库（git tag 需要）
        uses: actions/checkout@v4
      - name: 下载 CHS / CHT 两个 zip
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: 打日期 tag + 发布 Release
        shell: bash
        run: |
          set -euo pipefail
          tag="v$(date -u '+%Y%m%d-%H%M%S')"
          # 用 GITHUB_TOKEN 建 tag 不会触发新的 on:push run；直接 gh release create。
          # gh release create 需要 tag 已在远端；本地 git tag 后再 push 太慢，
          # 直接 --target 指向当前 commit SHA 由 gh 代建远端 tag。
          echo "创建 Release: $tag (target $GITHUB_SHA)"
          gh release create "$tag" \
            "dist/mj2-chs/MajestyII-CHS-"*.zip \
            "dist/mj2-cht/MajestyII-CHT-"*.zip \
            --target "$GITHUB_SHA" \
            --title "Majesty II 汉化补丁 $tag" \
            --notes "自动构建 CHS/CHT 汉化补丁。详见仓库 README。"
          echo "✅ 已发布: $tag"